<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Confirmation</title>
    <link rel="stylesheet" href="payment.css">
</head>

<body>

    <div class="overlay"></div>

    <!-- PAGE TITLE -->
    <h1 class="page-title">Payment Confirmation</h1>

    <!-- MAIN PAYMENT BOX -->
    <div class="payment-container">

        <div class="payment-content">

            <!-- LEFT SIDE: COST SUMMARY -->
            <div class="summary-box">
                <h2>Booking Summary</h2>

                <p class="summary-item">Rent per Night: <span id="rent">Rs 5000</span></p>
                <p class="summary-item">Number of Nights: <span id="nights">3</span></p>
                <p class="summary-item">Tax (10%): <span id="tax">Rs 1500</span></p>
                <p class="summary-item">Discount: <span id="discount">Rs 0</span></p>

                <p class="total">Total: <span id="total">Rs 16500</span></p>

                <!-- PROMO CODE -->
                <div class="promo">
                    <input type="text" id="promoCode" placeholder="Enter promo code">
                    <button class="apply-btn" onclick="applyPromo()">Apply</button>
                </div>
            </div>

            <!-- RIGHT SIDE: PAYMENT METHODS -->
            <div class="payment-methods">
                <h2>Select Payment Method</h2>

                <div class="method-box">
                    <div class="method active" id="jazzcash" onclick="selectMethod('jazzcash')">
                        JazzCash
                    </div>
                    <div class="method" id="easypaisa" onclick="selectMethod('easypaisa')">
                        EasyPaisa
                    </div>
                </div>

                <button class="pay-btn">Proceed to Pay</button>
            </div>

        </div>

    </div>

    <!-- FUNCTIONALITY -->
    <script>
        function selectMethod(method) {
            document.getElementById("jazzcash").classList.remove("active");
            document.getElementById("easypaisa").classList.remove("active");

            document.getElementById(method).classList.add("active");
        }

        function applyPromo() {
            let code = document.getElementById("promoCode").value.trim().toLowerCase();
            let discountField = document.getElementById("discount");
            let totalField = document.getElementById("total");

            let rent = 5000 * 3; // example values
            let tax = rent * 0.1;

            if (code === "haunted10") {
                let discount = rent * 0.1;
                discountField.textContent = "Rs " + discount;
                totalField.textContent = "Rs " + (rent + tax - discount);
            } else {
                discountField.textContent = "Rs 0";
                totalField.textContent = "Rs " + (rent + tax);
            }
        }
    </script>

</body>
</html>
