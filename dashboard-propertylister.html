<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Rent | Lister Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Griffy&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="overlay"></div>

  <nav class="navbar">
    <div class="logo">
      <img src="logo.png" alt="Phantom Systems Logo">
    </div>
    <ul class="nav-links">
      <li><a href="#">My Listings</a></li>
      <li><a href="#">Add New Property</a></li>
      <li><a href="#">Inquiries</a></li>
      <li><a href="#">Logout</a></li>
    </ul>
  </nav>

  <main class="hero">
    <div class="hero-text">
      <h2 class="welcome-text">WELCOME, SPIRIT SUMMONER, TO:</h2>
      <h1 class="title">GHOST RENT</h1>
      <p class="tagline">Where haunted homes find their next brave tenants...</p>
      <p class="byline">Manage your spectral properties, view bookings, and keep your spirits in check.</p>
      <div class="buttons">
        <button class="contact-btn">View My Listings</button>
        <button class="rent-btn">Add a New Haunt</button>
      </div>
    </div>
  </main>
</body>
</html>
